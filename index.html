
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cuestionario de conducción</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f1f5f9;color:#172033}
header{background:#174078;color:white;padding:20px;text-align:center}
main{max-width:850px;margin:20px auto;padding:0 12px}
.card{background:white;border-radius:14px;padding:18px;margin-bottom:16px;box-shadow:0 3px 12px #0001}
h1{font-size:24px;margin:0}
h2{font-size:20px;margin-top:0}
button{border:0;border-radius:9px;padding:12px 16px;background:#174078;color:white;font-weight:bold;font-size:15px;cursor:pointer}
button:disabled{opacity:.45}
.secondary{background:#e2e8f0;color:#172033}
input[type=file]{width:100%;padding:12px;margin:10px 0}
#status{white-space:pre-wrap;overflow-wrap:anywhere;color:#475569;margin-top:12px}
.progress{height:8px;background:#e2e8f0;border-radius:8px;overflow:hidden;margin-top:10px}
#bar{height:100%;width:0;background:#2582df}
.hidden{display:none!important}
.question{font-size:19px;font-weight:bold;line-height:1.5;white-space:pre-wrap;margin:18px 0}
.options{display:grid;gap:10px}
.option{display:flex;text-align:left;gap:10px;align-items:flex-start;width:100%;background:#f8fafc;color:#172033;border:1px solid #cbd5e1;font-weight:normal;line-height:1.5}
.option.selected{border:2px solid #2874c8}
.option.correct{background:#e7f8ed;border-color:#16803d}
.option.wrong{background:#ffeded;border-color:#c62828}
.letter{font-weight:bold;min-width:24px}
#feedback{padding:13px;border-radius:10px;margin-top:14px;line-height:1.5}
.good{background:#e7f8ed;color:#14532d}
.bad{background:#ffeded;color:#991b1b}
.neutral{background:#edf3fb;color:#243b5a}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.muted{color:#64748b;font-size:14px}
.reviewItem{padding:12px 0;border-top:1px solid #e2e8f0;white-space:pre-wrap}
</style>
</head>
<body>
<header>
  <h1>Cuestionario de conducción</h1>
  <p>Practica con tus preguntas en PDF</p>
</header>

<main>
  <section class="card" id="uploadCard">
    <h2>Cargar cuestionario</h2>
    <p class="muted">Selecciona el archivo PDF desde tu celular o computador.</p>
    <input id="pdfFile" type="file" accept=".pdf,application/pdf">
    <div class="actions">
      <button id="loadBtn">Cargar PDF</button>
      <button id="clearBtn" class="secondary">Limpiar</button>
    </div>
    <div class="progress"><div id="bar"></div></div>
    <div id="status" role="status">Esperando un archivo PDF.</div>
  </section>

  <section class="card hidden" id="quizCard">
    <div id="counter" class="muted"></div>
    <div id="question" class="question"></div>
    <div id="options" class="options"></div>
    <div id="feedback" class="hidden"></div>
    <div class="actions">
      <button id="prevBtn" class="secondary">Anterior</button>
      <button id="nextBtn">Siguiente</button>
      <button id="finishBtn" class="secondary">Finalizar</button>
    </div>
  </section>

  <section class="card hidden" id="resultCard">
    <h2>Resultado</h2>
    <p id="result"></p>
    <div class="actions">
      <button id="reviewBtn" class="secondary">Revisar respuestas</button>
      <button id="retryBtn">Intentar de nuevo</button>
    </div>
    <div id="review" class="hidden"></div>
  </section>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
(() => {
"use strict";

const $ = id => document.getElementById(id);
const state = {
  questions: [],
  answers: [],
  index: 0
};

if (window.pdfjsLib) {
  pdfjsLib.GlobalWorkerOptions.workerSrc =
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
}

function status(message, progress) {
  $("status").textContent = message;
  $("bar").style.width = Math.max(0, Math.min(100, progress)) + "%";
}

function normalize(text) {
  return text
    .replace(/\u00a0/g, " ")
    .split(/\r?\n/)
    .map(line => line.replace(/\s+/g, " ").trim())
    .filter(Boolean);
}

function parseQuestions(text) {
  const lines = normalize(text);
  const questions = [];
  let current = null;

  const optionPattern = /^([A-D])\s*[).:\-]\s*(.+)$/i;
  const questionPattern =
    /^(?:pregunta\s*)?(\d{1,3})\s*[).:\-]\s*(.+)$/i;
  const answerPattern =
    /^(?:respuesta\s*(?:correcta)?|correcta)\s*[:\-]\s*([A-D])\b/i;

  function save() {
    if (current && current.text.trim() && current.options.length) {
      questions.push(current);
    }
  }

  for (const line of lines) {
    const option = line.match(optionPattern);
    const answer = line.match(answerPattern);
    const numbered = line.match(questionPattern);

    if (answer && current) {
      current.correct = answer[1].toUpperCase();
      continue;
    }

    if (option && current) {
      const letter = option[1].toUpperCase();
      const previous = current.options.find(
        item => item.label === letter
      );

      if (previous) {
        previous.text += " " + option[2];
      } else {
        current.options.push({
          label: letter,
          text: option[2]
        });
      }
      continue;
    }

    const explicitQuestion = /^pregunta\s+\d+\b/i.test(line);
    const numberedQuestion =
      numbered && (!current || current.options.length > 0);

    if (explicitQuestion || numberedQuestion) {
      save();
      current = {
        text: numbered ? numbered[2] : line,
        options: [],
        correct: null
      };
      continue;
    }

    if (!current) {
      current = {text: line, options: [], correct: null};
    } else if (current.options.length === 0) {
      current.text += " " + line;
    } else {
      current.options[current.options.length - 1].text +=
        " " + line;
    }
  }

  save();

  return questions.map((q, i) => ({
    ...q,
    number: i + 1
  }));
}

async function readPdf(file) {
  if (!window.pdfjsLib) {
    throw new Error(
      "No se pudo cargar PDF.js. Verifica tu conexión a Internet y vuelve a intentarlo."
    );
  }

  const buffer = await file.arrayBuffer();
  const loadingTask = pdfjsLib.getDocument({
    data: new Uint8Array(buffer),
    isEvalSupported: false,
    useSystemFonts: true
  });

  const pdf = await loadingTask.promise;
  let result = "";

  for (let pageNumber = 1; pageNumber <= pdf.numPages; pageNumber++) {
    status(
      "Procesando página " + pageNumber + " de " + pdf.numPages + "...",
      pageNumber / pdf.numPages * 100
    );

    const page = await pdf.getPage(pageNumber);
    const content = await page.getTextContent();

    let pageText = "";
    let previousY = null;

    for (const item of content.items) {
      if (!item.str) continue;

      const y = item.transform ? item.transform[5] : null;

      if (
        previousY !== null &&
        y !== null &&
        Math.abs(y - previousY) > 3
      ) {
        pageText += "\n";
      } else if (pageText && !pageText.endsWith("\n")) {
        pageText += " ";
      }

      pageText += item.str;
      previousY = y;
    }

    result += "\n" + pageText + "\n";

    // Cede tiempo al navegador para actualizar el progreso.
    await new Promise(resolve => setTimeout(resolve, 0));
  }

  return result;
}

$("loadBtn").addEventListener("click", async () => {
  const file = $("pdfFile").files[0];

  if (!file) {
    alert("Selecciona un archivo PDF primero.");
    return;
  }

  $("loadBtn").disabled = true;
  $("quizCard").classList.add("hidden");
  $("resultCard").classList.add("hidden");
  status("Abriendo el documento...", 1);

  try {
    const text = await readPdf(file);
    const questions = parseQuestions(text);

    if (!questions.length) {
      throw new Error(
        "No se detectaron preguntas. Comprueba que el PDF tenga texto seleccionable y que las opciones estén identificadas con A), B), C) o D)."
      );
    }

    state.questions = questions;
    state.answers = new Array(questions.length).fill(null);
    state.index = 0;

    status(
      "PDF leído. Se detectaron " + questions.length + " preguntas.",
      100
    );

    $("quizCard").classList.remove("hidden");
    renderQuestion();
    $("quizCard").scrollIntoView({behavior: "smooth"});
  } catch (error) {
    console.error(error);
    status("Error: " + error.message, 0);
    alert("No se pudo cargar el cuestionario:\n\n" + error.message);
  } finally {
    $("loadBtn").disabled = false;
  }
});

function renderQuestion() {
  const q = state.questions[state.index];
  if (!q) return;

  $("counter").textContent =
    "Pregunta " + (state.index + 1) +
    " de " + state.questions.length;

  $("question").textContent = q.text;
  $("options").replaceChildren();

  $("feedback").className = "hidden";
  $("feedback").textContent = "";

  for (const option of q.options) {
    const button = document.createElement("button");
    button.type = "button";
    button.className = "option";

    const letter = document.createElement("span");
    letter.className = "letter";
    letter.textContent = option.label + ".";

    const text = document.createElement("span");
    text.textContent = option.text;

    button.append(letter, text);

    if (state.answers[state.index] === option.label) {
      button.classList.add("selected");
    }

    if (q.correct) {
      if (option.label === q.correct) {
        button.classList.add("correct");
      } else if (state.answers[state.index] === option.label) {
        button.classList.add("wrong");
      }
    }

    button.addEventListener("click", () => {
      state.answers[state.index] = option.label;
      renderQuestion();
      showFeedback(option.label);
    });

    $("options").appendChild(button);
  }

  $("prevBtn").disabled = state.index === 0;
  $("nextBtn").textContent =
    state.index === state.questions.length - 1
      ? "Ver resultado"
      : "Siguiente";

  const selected = state.answers[state.index];
  if (selected) showFeedback(selected);
}

function showFeedback(label) {
  const q = state.questions[state.index];
  const box = $("feedback");

  box.classList.remove("hidden", "good", "bad", "neutral");

  if (!q.correct) {
    box.classList.add("neutral");
    box.textContent =
      "Respuesta registrada: " + label +
      ". No se encontró una clave de respuesta reconocible en el PDF; no es posible confirmar automáticamente si es correcta.";
    return;
  }

  if (label === q.correct) {
    box.classList.add("good");
    box.textContent = "¡Correcto! Respuesta: " + q.correct + ".";
  } else {
    box.classList.add("bad");
    box.textContent =
      "Respuesta incorrecta. Elegiste " + label +
      "; la clave detectada en el PDF es " + q.correct + ".";
  }
}

$("prevBtn").addEventListener("click", () => {
  if (state.index > 0) {
    state.index--;
    renderQuestion();
  }
});

$("nextBtn").addEventListener("click", () => {
  if (state.index < state.questions.length - 1) {
    state.index++;
    renderQuestion();
  } else {
    finishQuiz();
  }
});

$("finishBtn").addEventListener("click", finishQuiz);

function finishQuiz() {
  const answered = state.answers.filter(Boolean).length;
  const known = state.questions.filter(q => q.correct);
  const correct = state.questions.reduce((total, q, i) => {
    return total + (
      q.correct && state.answers[i] === q.correct ? 1 : 0
    );
  }, 0);

  $("result").textContent =
    "Respondiste " + answered + " de " +
    state.questions.length + " preguntas. " +
    (known.length
      ? "De las " + known.length +
        " preguntas con clave reconocida, acertaste " + correct + "."
      : "El PDF no contiene claves de respuesta reconocibles; no se puede calcular una nota fiable automáticamente.");

  $("resultCard").classList.remove("hidden");
  $("review").classList.add("hidden");
  $("resultCard").scrollIntoView({behavior: "smooth"});
}

$("reviewBtn").addEventListener("click", () => {
  const review = $("review");
  review.replaceChildren();

  state.questions.forEach((q, i) => {
    const item = document.createElement("div");
    item.className = "reviewItem";

    const title = document.createElement("strong");
    title.textContent = (i + 1) + ". " + q.text;

    const answer = document.createElement("p");
    answer.textContent =
      "Tu respuesta: " + (state.answers[i] || "Sin responder") +
      (q.correct
        ? " | Respuesta detectada: " + q.correct
        : " | Sin clave detectada");

    item.append(title, answer);
    review.appendChild(item);
  });

  review.classList.toggle("hidden");
});

$("retryBtn").addEventListener("click", () => {
  state.answers = new Array(state.questions.length).fill(null);
  state.index = 0;
  $("resultCard").classList.add("hidden");
  renderQuestion();
  $("quizCard").classList.remove("hidden");
  $("quizCard").scrollIntoView({behavior: "smooth"});
});

$("clearBtn").addEventListener("click", () => {
  state.questions = [];
  state.answers = [];
  state.index = 0;

  $("pdfFile").value = "";
  $("quizCard").classList.add("hidden");
  $("resultCard").classList.add("hidden");
  $("review").replaceChildren();

  status("Esperando un archivo PDF.", 0);
});
})();
</script>
</body>
</html>
